services:
  kafka-1:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_LISTENERS: 'EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'EXTERNAL://localhost:9092,INTERNAL://kafka-1:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SSL'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      CLUSTER_ID: ${CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_SSL_CLIENT_AUTH: "required"
      KAFKA_SSL_KEYSTORE_TYPE: "PEM"
      KAFKA_SSL_KEYSTORE_LOCATION: "/etc/kafka/secrets/broker-keystore.pem"
      KAFKA_SSL_TRUSTSTORE_TYPE: "PEM"
      KAFKA_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/secrets/ca.pem"
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      KAFKA_SUPER_USERS: "User:ANONYMOUS"
    volumes:
      - kafka_1_data:/var/lib/kafka/data
      - ./security/broker-1-creds:/etc/kafka/secrets:ro,Z
    networks:
      - kafka-net

  kafka-2:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-2
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_LISTENERS: 'EXTERNAL://0.0.0.0:9094,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'EXTERNAL://localhost:9094,INTERNAL://kafka-2:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SSL'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      CLUSTER_ID: ${CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_SSL_CLIENT_AUTH: "required"
      KAFKA_SSL_KEYSTORE_TYPE: "PEM"
      KAFKA_SSL_KEYSTORE_LOCATION: "/etc/kafka/secrets/broker-keystore.pem"
      KAFKA_SSL_TRUSTSTORE_TYPE: "PEM"
      KAFKA_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/secrets/ca.pem"
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      KAFKA_SUPER_USERS: "User:ANONYMOUS"
    volumes:
      - kafka_2_data:/var/lib/kafka/data
      - ./security/broker-2-creds:/etc/kafka/secrets:ro,Z
    networks:
      - kafka-net

  kafka-3:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-3
    ports:
      - "9095:9095"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_LISTENERS: 'EXTERNAL://0.0.0.0:9095,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'EXTERNAL://localhost:9095,INTERNAL://kafka-3:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SSL'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      CLUSTER_ID: ${CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_SSL_CLIENT_AUTH: "required"
      KAFKA_SSL_KEYSTORE_TYPE: "PEM"
      KAFKA_SSL_KEYSTORE_LOCATION: "/etc/kafka/secrets/broker-keystore.pem"
      KAFKA_SSL_TRUSTSTORE_TYPE: "PEM"
      KAFKA_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/secrets/ca.pem"
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      KAFKA_SUPER_USERS: "User:ANONYMOUS"
    volumes:
      - kafka_3_data:/var/lib/kafka/data
      - ./security/broker-3-creds:/etc/kafka/secrets:ro,Z
    networks:
      - kafka-net


  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - kafka-net

  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            fraud-sentinel-cluster:
              properties:
                bootstrap.servers: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
    ports:
      - "8080:8080"
    networks:
      - kafka-net
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  producer:
    build: ./services/producer
    container_name: producer
    profiles: ["app"]
    network_mode: host
    volumes:
      - ./security:/app/security:ro
      - ./.env:/app/.env:ro
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    restart: on-failure

  fraud-consumer:
    build: ./services/fraud-consumer
    container_name: fraud-consumer
    profiles: ["app"]
    network_mode: host
    volumes:
      - ./security:/app/security:ro
      - ./.env:/app/.env:ro
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - mongodb
    restart: on-failure

  dashboard:
    build: ./services/dashboard
    container_name: dashboard
    profiles: ["app"]
    network_mode: host
    volumes:
      - ./security:/app/security:ro
      - ./.env:/app/.env:ro
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - mongodb
    restart: on-failure

  stress-producer:
    build: ./services/stress-producer
    container_name: stress-producer
    profiles: ["demo"]
    network_mode: host
    volumes:
      - ./security:/app/security:ro
      - ./.env:/app/.env:ro
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    restart: "no"

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  mongodb_data:

networks:
  kafka-net:
    driver: bridge